## @file platformio.ini
# @brief PlatformIO-productieconfiguratie voor de ESP32-C3 met ERM- en LRA-actuatoren.
# @date 2026-11-08
# @author ProtoIoT Wietse Houwers
# @note Prototype software for evaluation use only.

[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
extra_scripts = post:scripts/package_ota.py
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    tzapu/WiFiManager @ 2.0.17
    adafruit/Adafruit BNO08x @ 1.2.5

; Reguliere houdingsfeedback met vier VLV041235L-L20 LRA-actuatoren.
[env:lra]
extends = env:esp32-c3-devkitm-1
build_flags =
    ${env:esp32-c3-devkitm-1.build_flags}
    -D STABIELATOR_LRA=1
